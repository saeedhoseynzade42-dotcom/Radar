<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071318">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>رادار زمین‌کاو</title>
<style>
:root{--bg:#071318;--bg2:#0b1b22;--panel:#10252e;--panel2:#16323d;--line:#1d3d48;--text:#e5eff1;--muted:#87a3ab;--phos:#46f0b9;--phosd:#1c7a60;--amber:#ffa53f;--red:#ff5d62;--blue:#5aa9ff;--r:14px;--mono:ui-monospace,"Roboto Mono",Consolas,monospace;--sans:system-ui,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums}
html,body{overflow-x:hidden;max-width:100vw}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;width:100%;max-width:100vw}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;padding:10px 14px 6px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.2px;min-width:0;flex:1 1 auto}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;align-items:center;gap:5px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap}
#segRange{direction:ltr}
canvas#runScope{width:100%;height:64px;display:block;border-radius:10px;background:#061a1d;border:1px solid var(--line);margin-top:8px}
.panel,.pane>*{min-width:0}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.good i{background:var(--phos)}.chip.mid i{background:var(--amber)}.chip.bad i{background:var(--red)}
.chip.demo{color:var(--blue);border-color:var(--blue)}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
main{position:relative;overflow:hidden}
.pane{position:absolute;inset:0;overflow:auto;padding:6px 14px 20px;display:none;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
#p-map{padding:0;overflow:hidden}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav button{position:relative;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--phos)}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--phos)}
.radarwrap{width:min(100%,54dvh);margin:0 auto;position:relative}
#radar{width:100%;aspect-ratio:1;display:block;touch-action:manipulation}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:0 14px;height:40px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--phos)}
.btn{height:48px;border-radius:12px;padding:0 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--phos);color:#04221a;border-color:transparent}
.btn.big{height:60px;font-size:18px;width:100%}
.btn.sm{height:40px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--red)}
.btn.rec{background:var(--red);color:#2a0507;border-color:transparent}
.btn:focus-visible,.seg button:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--panel);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.readout{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.big-num{font:600 46px/1 var(--mono);direction:ltr;unicode-bidi:isolate;letter-spacing:-1px}
.big-num small{font-size:16px;color:var(--muted);font-weight:400;margin-inline-start:6px;letter-spacing:0}
.rd-side{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.st{font-weight:600;font-size:15px}
.st.none{color:var(--phos)}.st.weak{color:var(--amber)}.st.strong{color:var(--red)}
.meter{grid-column:1/-1;display:flex;gap:3px;margin-top:8px;direction:ltr}
.meter b{flex:1;height:10px;border-radius:2px;background:#1a343e}
.meter b.on.g{background:var(--phos)}.meter b.on.a{background:var(--amber)}.meter b.on.r{background:var(--red)}
.note{font-size:13px;color:var(--muted);margin:6px 0}
h2{font-size:15px;font-weight:600;margin:0 0 8px}
.sel-card .dist{font:600 30px/1.1 var(--mono);direction:ltr;unicode-bidi:isolate}
.sel-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sel-card .pname{font-weight:600;font-size:17px}
.sel-card .arrived{color:var(--phos);font-weight:600}
.stbtns{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.pill{border:1px solid var(--line);background:var(--bg2);border-radius:16px;padding:0 9px;height:32px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pill.on{border-color:var(--text);color:var(--text)}
.dot-unchecked{background:#8da3a9}.dot-weak{background:var(--amber)}.dot-anomaly{background:var(--red)}.dot-clear{background:var(--phos)}
.list .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .row:last-child{border-bottom:0}
.list .row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row .ds{font-size:13px;color:var(--muted);white-space:nowrap}
.list .row i{width:12px;height:12px;border-radius:50%;flex:none}
.list .row.sel{background:linear-gradient(90deg,transparent,rgba(70,240,185,.08))}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.dlg input[type=text]{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 12px;font:600 16px var(--mono);color:var(--text);width:100%}
.form select{font-family:var(--sans)}
.form .full{grid-column:1/-1}
canvas.grid{width:100%;display:block;border-radius:10px;background:#061a1d;border:1px solid var(--line)}
.runhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.runhead b{font-size:20px}
.dirhint{font-size:15px;font-weight:600;color:var(--phos)}
.xrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow .tx{flex:1;min-width:0}.xrow .tx b{display:block;font-size:15px}.xrow .tx span{font-size:12px;color:var(--muted)}
.xrow .btn{width:44px;padding:0;height:44px}
#map{width:100%;height:100%;background:#071318}
.mapbtns{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapbtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(7,19,24,.85);color:var(--text);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0}
.mapbtns button.on{color:var(--phos);border-color:var(--phos)}
.maphint{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;z-index:2}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);z-index:2}
.mk{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(-4px)}
.mk b{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px #0008}
.mk span{font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.me{width:22px;height:22px;position:relative}
.me i{position:absolute;inset:3px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 6px rgba(90,169,255,.25)}
.me s{position:absolute;left:50%;top:-8px;margin-left:-6px;border:6px solid transparent;border-bottom:10px solid var(--blue);border-top:0}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;overflow:auto}
.overlay h1{margin:0;font-size:26px;font-weight:600}
.overlay p{max-width:34ch;margin:0;color:var(--muted)}
.overlay .btn{width:min(100%,320px)}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.langs button{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.langs button.on{color:var(--phos);border-color:var(--phos)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet-body{width:min(100%,520px);max-height:88dvh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--sb))}
.sheet-body h2{font-size:17px}
.dlg .acts{display:flex;gap:8px;margin-top:12px}.dlg .acts .btn{flex:1}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row input[type=range]{flex:1;max-width:55%;accent-color:var(--phos)}
.set-row:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(78px + var(--sb));transform:translateX(-50%);z-index:60;background:#000d;color:#fff;border-radius:20px;padding:9px 16px;font-size:14px;max-width:90vw;text-align:center;pointer-events:none}
.maplibregl-ctrl-attrib{font-size:10px!important}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.summary div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.summary b{display:block;font:600 20px var(--mono);direction:ltr;unicode-bidi:isolate}
.summary span{font-size:12px;color:var(--muted)}
.scanrow{padding:10px 0;border-bottom:1px solid var(--line)}
.scanrow:last-child{border-bottom:0}
.scanrow .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#061a1d" stroke="#46f0b9" stroke-width="3"/><circle cx="32" cy="32" r="19" fill="none" stroke="#1c7a60" stroke-width="2"/><circle cx="32" cy="32" r="9" fill="none" stroke="#1c7a60" stroke-width="2"/><path d="M32 32 L32 4 A28 28 0 0 1 56 18 Z" fill="#46f0b9" fill-opacity=".35"/><line x1="32" y1="32" x2="32" y2="4" stroke="#46f0b9" stroke-width="2.5"/><circle cx="43" cy="40" r="4" fill="#ff5d62"/></symbol>
</svg>

<div id="start" class="overlay">
  <svg width="104" height="104"><use href="#logo"/></svg>
  <h1 data-t="appName"></h1>
  <p data-t="start_text"></p>
  <div class="langs" id="langs0"></div>
  <button class="btn pri big" id="btnStart" data-t="start_btn"></button>
  <button class="btn" id="btnDemo" data-t="demo_btn"></button>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><svg width="30" height="30"><use href="#logo"/></svg><span data-t="appName"></span></div>
    <div class="chips">
      <span class="chip demo" id="chDemo" hidden data-t="demo_badge"></span>
      <span class="chip" id="chGps"><i></i><span class="num" id="chGpsV">—</span></span>
      <span class="chip" id="chMag"><i></i><span class="num" id="chMagV">—</span></span>
      <button class="gear" id="btnGear" aria-label="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main>
    <section class="pane on" id="p-radar">
      <div class="radarwrap"><canvas id="radar"></canvas></div>
      <div class="bar">
        <div class="seg" id="segRange"><button data-r="5">5</button><button data-r="10">10</button><button data-r="15">15</button></div>
        <button class="btn sm" id="btnOrient"></button>
        <button class="btn sm" id="btnSound"></button>
      </div>
      <div class="panel">
        <div class="readout">
          <div class="big-num"><span id="rdDelta">—</span><small>µT</small></div>
          <div class="rd-side"><span class="st none" id="rdStatus"></span><span><span data-t="field"></span>: <span class="num" id="rdTotal">—</span> µT</span></div>
          <div class="meter" id="meter"></div>
        </div>
        <div class="note" id="rdNote"></div>
        <button class="btn sm" id="btnBase" data-t="set_base"></button>
      </div>
      <div class="panel sel-card" id="selCard" hidden></div>
      <div class="panel">
        <div class="runhead"><h2 data-t="pins"></h2></div>
        <div class="bar">
          <button class="btn sm" id="btnAddPin"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-t="add_pin"></span></button>
          <button class="btn sm" id="btnImport"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg><span data-t="import_kml"></span></button>
          <button class="btn sm" id="btnPatrol"></button>
        </div>
        <div class="note" id="patrolNote" hidden></div>
        <div class="list" id="pinList"></div>
      </div>
    </section>

    <section class="pane" id="p-map">
      <div id="map"></div>
      <div class="mapbtns">
        <button id="mbTilt" aria-label="3D"></button>
        <button id="mbLabels" class="on" aria-label="labels"></button>
        <button id="mbLayer" aria-label="layer"></button>
        <button id="mbMe" aria-label="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      </div>
      <div class="maphint" id="mapHint"></div>
      <div class="mapmsg" id="mapMsg" hidden></div>
    </section>

    <section class="pane" id="p-scan">
      <div id="scanSetup" class="panel">
        <h2 data-t="scan_setup"></h2>
        <div class="form">
          <label class="full"><span data-t="center"></span>
            <select id="scMode"><option value="pin" data-t="center_pin"></option><option value="me" data-t="center_me"></option></select></label>
          <label><span data-t="width"></span><input id="scW" type="number" inputmode="decimal" min="2" max="40" step="0.5"></label>
          <label><span data-t="length"></span><input id="scL" type="number" inputmode="decimal" min="2" max="40" step="0.5"></label>
          <label><span data-t="spacing"></span><input id="scSp" type="number" inputmode="decimal" min="0.25" max="3" step="0.25"></label>
          <label><span data-t="step"></span><input id="scSt" type="number" inputmode="decimal" min="0.1" max="1" step="0.05"></label>
        </div>
        <p class="note" id="scInfo"></p>
        <p class="note" data-t="corners"></p>
        <button class="btn pri big" id="btnBuild" data-t="build_scan"></button>
      </div>
      <div id="scanRun" class="panel" hidden></div>
      <div class="panel">
        <h2 data-t="scans"></h2>
        <div id="scanList"></div>
      </div>
    </section>

    <section class="pane" id="p-export">
      <div class="panel">
        <div class="form"><label class="full"><span data-t="ex_choose"></span><select id="exSel"></select></label></div>
        <p class="note" id="exNote"></p>
        <div id="exList"></div>
      </div>
      <div class="panel">
        <button class="btn" id="btnOpenPrj" data-t="ex_open_prj"></button>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="radar" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg><span data-t="tab_radar"></span></button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="tab_map"></span></button>
    <button data-tab="scan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span data-t="tab_scan"></span></button>
    <button data-tab="export"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg><span data-t="tab_export"></span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileKml" hidden>
<input type="file" id="filePrj" hidden>

<script>
(function (root) {
'use strict';

var R = 6371008.8, D2R = Math.PI / 180, R2D = 180 / Math.PI;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function normDeg(a) { a = a % 360; return a < 0 ? a + 360 : a; }
function angDiff(a, b) { var d = normDeg(a - b); return d > 180 ? d - 360 : d; }
function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ---------- geo ---------- */
function destPoint(lat, lon, brg, d) {
  var p1 = lat * D2R, l1 = lon * D2R, th = brg * D2R, dl = d / R;
  var p2 = Math.asin(Math.sin(p1) * Math.cos(dl) + Math.cos(p1) * Math.sin(dl) * Math.cos(th));
  var l2 = l1 + Math.atan2(Math.sin(th) * Math.sin(dl) * Math.cos(p1), Math.cos(dl) - Math.sin(p1) * Math.sin(p2));
  return { lat: p2 * R2D, lon: ((l2 * R2D + 540) % 360) - 180 };
}
function distBearing(lat1, lon1, lat2, lon2) {
  var p1 = lat1 * D2R, p2 = lat2 * D2R, dp = p2 - p1, dl = (lon2 - lon1) * D2R;
  var a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  var d = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  var d = $('#runDelta'); if (!d) return;
  d.textContent = RT.mag.ok ? (RT.mag.delta > 0 ? '+' : '') + RT.mag.delta.toFixed(1) : '—';
  var info = $('#runInfo');
  if (RT.line) { info.textContent = ((performance.now() - RT.line.t0) / 1000).toFixed(0) + ' s'; $('#runInfoL').textContent = RT.line.samples.length + ' samples'; }
  else { info.textContent = RT.run.lines.length + '/' + RT.run.ys.length; $('#runInfoL').textContent = t('scans'); }
  if (RT.line && !RT.line.drawT) { RT.line.drawT = 1; }
}
function finishScan() {
  var r = RT.run; if (!r) return;
  if (!r.lines.length) { toast(t('too_short')); return; }
  var scan = { id: r.id, name: r.name, pinId: r.pinId, center: r.center, sizeX: r.sizeX, sizeY: r.sizeY, spacing: r.spacing, step: r.step, created: r.created, demo: r.demo,
    lines: r.lines.slice().sort(function (a, b) { return a.i - b.i; }) };
  var pts = C.scanPoints(scan), st = C.scanStats(pts), th = thr();
  scan.max = st.maxAbs; scan.status = C.statusFromMax(st.maxAbs, th.weak, th.strong);
  S.scans.push(scan); if (r.pinId) setPinStatus(r.pinId, scan.status);
  RT.run = null; RT.line = null; save(); rebuildScanBlips();
  renderRun(); renderScanList(); renderPins(); renderSelCard(); mapSyncMarkers(); mapData(); renderExport();
  toast(t('scan_done') + ': ' + st.maxAbs.toFixed(1) + ' µT');
  if (S.settings.vib && navigator.vibrate) navigator.vibrate([60, 40, 60]);
}
function renderScanList() {
  var box = $('#scanList');
  if (!S.scans.length) { box.innerHTML = '<p class="note">' + t('no_scans') + '</p>'; return; }
  box.innerHTML = S.scans.slice().reverse().map(function (s) {
    return '<div class="scanrow" data-id="' + s.id + '"><div style="display:flex;gap:12px;align-items:center"><div class="thumb"></div><div style="flex:1;min-width:0"><b>' + esc(s.name) + (s.demo ? ' · ' + t('demo_badge') : '') + '</b><div class="note"><span class="pill"><i class="dot-' + s.status + '"></i>' + t('s_' + s.status) + '</span> <span class="num">' + s.max.toFixed(1) + '</span> µT · ' + t('points_n', { n: s.lines.reduce(function (a, l) { return a + l.pts.length; }, 0) }) + '</div></div></div>' +
      '<div class="acts"><button class="btn sm" data-a="map">' + t('show_map') + '</button><button class="btn sm" data-a="exp">' + t('tab_export') + '</button><button class="btn sm danger" data-a="del">' + t('del') + '</button></div></div>';
  }).join('');
  $$('.scanrow', box).forEach(function (row) {
    var s = S.scans.filter(function (q) { return q.id === row.dataset.id; })[0], th = $('.thumb', row);
    var cv = heatCanvas(s, 64); cv.style.cssText = 'width:64px;height:' + Math.round(64 * s.sizeY / Math.max(s.sizeX, s.sizeY)) + 'px;background:#061a1d;border:1px solid var(--line);border-radius:6px;display:block'; th.appendChild(cv);
    $$('[data-a]', row).forEach(function (b) {
      b.onclick = async function () {
        var a = b.dataset.a;
        if (a === 'map') { setTab('map'); mapFly(s.center.lat, s.center.lon); }
        else if (a === 'exp') { RT.exSel = s.id; setTab('export'); }
        else if (a === 'del' && await confirmDlg(t('sure'))) { S.scans = S.scans.filter(function (q) { return q.id !== s.id; }); save(); rebuildScanBlips(); renderScanList(); renderExport(); mapData(); }
      };
    });
  });
}

/* ---------- export ---------- */
function canvasPng(cv) { return new Promise(function (res) { cv.toBlob(function (b) { b.arrayBuffer().then(function (a) { res(new Uint8Array(a)); }); }, 'image/png'); }); }
async function buildKMZ(scan) {
  var th = thr(), sp = selPin(), center = scan ? scan.center : sp ? { lat: sp.lat, lon: sp.lon } : RT.pos, sc = null, imgs = [];
  if (scan) {
    var pts = C.scanPoints(scan), strong = pts.filter(function (p) { return Math.abs(p.a) >= th.weak; }).sort(function (a, b) { return Math.abs(b.a) - Math.abs(a.a); }).slice(0, 200);
    var fn = 'heat_' + scan.name + '.png'; imgs.push({ name: fn, data: await canvasPng(heatCanvas(scan, 512)) });
    sc = Object.assign({}, scan, { overlay: fn, strong: strong });
  }
  var kml = C.buildKML({ name: (RT.demo ? 'DEMO ' : '') + 'Radar Zamin Kav' + (scan ? ' - ' + scan.name : ''), pins: S.pins, rings: center ? { lat: center.lat, lon: center.lon, radii: [5, 10, 15] } : null, scans: sc ? [sc] : [] });
  return C.makeZip([{ name: 'doc.kml', data: C.utf8(kml) }].concat(imgs));
}
async function buildFile(kind, scan) {
  var tag = (RT.demo ? 'DEMO_' : '') + 'RadarZaminKav_' + (scan ? scan.name : 'pins') + '_' + today(), pts = scan ? C.scanPoints(scan) : null;
  if (kind === 'kmz') return { name: tag + '.kmz', mime: 'application/vnd.google-earth.kmz', data: await buildKMZ(scan) };
  if (kind === 'zk') return { name: tag + '_ZaminKav.csv', mime: 'text/csv', data: C.utf8(C.csvZaminKav(pts)) };
  if (kind === 'sf') return { name: tag + '_Surfer.dat', mime: 'text/plain', data: C.utf8(C.datSurfer(pts)) };
  if (kind === 'vx') return { name: tag + '_Voxler.csv', mime: 'text/csv', data: C.utf8(C.csvVoxler(pts)) };
  if (kind === 'raw') return { name: tag + '_Full.csv', mime: 'text/csv', data: C.utf8(C.csvRaw(pts)) };
  if (kind === 'prj') return { name: tag + '_Project.json', mime: 'application/json', data: C.utf8(C.serializeProject({ pins: S.pins, scans: S.scans, settings: S.settings })) };
  if (kind === 'zip') {
    var ks = scan ? ['kmz', 'zk', 'sf', 'vx', 'raw', 'prj'] : ['kmz', 'prj'], fs = [];
    for (var i = 0; i < ks.length; i++) { var f = await buildFile(ks[i], scan); fs.push({ name: f.name, data: f.data }); }
    return { name: tag + '_All.zip', mime: 'application/zip', data: C.makeZip(fs) };
  }
}
function download(f) {
  var blob = new Blob([f.data], { type: f.mime }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = f.name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function shareFile(f) {
  try {
    var file = new File([f.data], f.name, { type: f.mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: f.name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(f);
}
function renderExport() {
  var sel = $('#exSel'), cur = RT.exSel || (S.scans.length ? S.scans[S.scans.length - 1].id : '');
  if (!S.scans.some(function (s) { return s.id === cur; })) cur = S.scans.length ? S.scans[S.scans.length - 1].id : '';
  RT.exSel = cur;
  sel.innerHTML = '<option value="">' + t('ex_none') + '</option>' + S.scans.map(function (s) { return '<option value="' + s.id + '"' + (s.id === cur ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
  $('#exNote').textContent = cur ? '' : t('ex_none_note'); $('#exNote').hidden = !!cur;
  var scan = S.scans.filter(function (s) { return s.id === cur; })[0] || null;
  var rows = [['kmz', 'ex_kmz', 'ex_kmz_d']];
  if (scan) rows.push(['zk', 'ex_zk', 'ex_zk_d'], ['sf', 'ex_sf', 'ex_sf_d'], ['vx', 'ex_vx', 'ex_vx_d'], ['raw', 'ex_raw', 'ex_raw_d']);
  rows.push(['prj', 'ex_prj', 'ex_prj_d'], ['zip', 'ex_zip', 'ex_kmz_d']);
  var canShare = !!navigator.share;
  var dl = '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>', sh = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>';
  $('#exList').innerHTML = rows.map(function (r) {
    return '<div class="xrow"><div class="tx"><b>' + t(r[1]) + '</b><span>' + (r[0] === 'zip' ? '' : t(r[2])) + '</span></div><button class="btn" data-k="' + r[0] + '" data-m="d" aria-label="download">' + dl + '</button>' +
      (canShare ? '<button class="btn" data-k="' + r[0] + '" data-m="s" aria-label="' + t('ex_share') + '">' + sh + '</button>' : '') + '</div>';
  }).join('');
  $$('#exList [data-k]').forEach(function (b) {
    b.onclick = async function () {
      try { var f = await buildFile(b.dataset.k, scan); if (b.dataset.m === 's') await shareFile(f); else { download(f); toast(t('ex_done')); } }
      catch (e) { toast(t('ex_fail')); }
    };
  });
}

/* ---------- import ---------- */
async function importKml(file) {
  try {
    var bytes = new Uint8Array(await file.arrayBuffer()), r = await C.readPinsFromFile(bytes, file.name), added = 0;
    r.pins.forEach(function (p) {
      var dup = S.pins.some(function (q) { return q.name === p.name && C.distBearing(q.lat, q.lon, p.lat, p.lon).d < 0.5; });
      if (!dup) { S.pins.push({ id: uid(), name: p.name, lat: p.lat, lon: p.lon, status: 'unchecked' }); added++; }
    });
    if (!S.sel && S.pins.length) S.sel = S.pins[0].id;
    save(); renderPins(); renderSelCard(); mapSyncMarkers();
    toast(t('imported', { n: added }) + (r.skipped ? ' ' + t('skipped', { n: r.skipped }) : ''));
    if (added && MAP.map && MAP.ready && S.pins.length) MAP.pendingFly = null;
  } catch (e) { toast(t('import_fail')); }
}
async function importProject(file) {
  try {
    var o = C.parseProject(await file.text());
    o.pins.forEach(function (p) { if (!S.pins.some(function (q) { return q.id === p.id; })) S.pins.push(p); });
    o.scans.forEach(function (s) { if (!S.scans.some(function (q) { return q.id === s.id; })) S.scans.push(s); });
    if (!S.sel && S.pins.length) S.sel = S.pins[0].id;
    save(); rebuildScanBlips(); renderPins(); renderSelCard(); renderScanList(); renderExport(); mapSyncMarkers(); mapData(); toast(t('prj_loaded'));
  } catch (e) { toast(t('prj_bad')); }
}

/* ---------- settings ---------- */
function openSettings() {
  var s = S.settings;
  openSheet('<h2>' + t('settings') + '</h2><div class="set-row"><span>' + t('lang') + '</span></div><div class="langs" id="langs1" style="justify-content:flex-start;margin-bottom:6px"></div>' +
    '<div class="set-row"><span>' + t('sensitivity') + '</span><input type="range" id="sSens" min="0.5" max="3" step="0.1" value="' + s.sens + '"></div>' +
    '<div class="set-row"><span>' + t('volume') + '</span><input type="range" id="sVol" min="0" max="1" step="0.05" value="' + s.vol + '"></div>' +
    '<div class="set-row"><span>' + t('vibrate') + '</span><input type="checkbox" id="sVib" ' + (s.vib ? 'checked' : '') + '></div>' +
    '<div class="set-row" style="display:block"><p class="note num">v1.0</p></div>' +
    '<div class="acts" style="display:flex;gap:8px"><button class="btn danger" id="sClear" style="flex:1">' + t('clear_all') + '</button><button class="btn pri" id="sClose" style="flex:1">' + t('close') + '</button></div>');
  renderLangs();
  $('#sSens').oninput = function () { s.sens = parseFloat(this.value); save(); rebuildScanBlips(); };
  $('#sVol').oninput = function () { s.vol = parseFloat(this.value); save(); };
  $('#sVib').onchange = function () { s.vib = this.checked; save(); };
  $('#sClose').onclick = closeSheet;
  $('#sClear').onclick = async function () {
    if (await confirmDlg(t('sure'))) { S.pins = []; S.scans = []; S.sel = null; RT.patrolPts = []; rebuildScanBlips(); save(); renderPins(); renderSelCard(); renderScanList(); renderExport(); mapSyncMarkers(); mapData(); toast(t('cleared')); }
  };
}

/* ---------- start / init ---------- */
function wakeLock() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () { }); } catch (e) { } }
function begin() {
  RT.started = true; $('#start').hidden = true; $('#app').hidden = false; $('#chDemo').hidden = !RT.demo;
  buildMeter(); wakeLock(); applyLang(); rebuildScanBlips();
  setInterval(demoTick, 50); setInterval(audioTick, 40);
  setInterval(function () { updateReadout(); updateRunLive(); }, 100);
  setInterval(function () { renderPins(); mapUpdate(false); }, 1000);
  setInterval(function () { if (RT.run) drawRunGrid(); }, 700);
  requestAnimationFrame(drawRadar);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wakeLock(); });
}
function init() {
  load(); I.setLang(S.settings.lang); applyLang();
  $('#btnStart').onclick = async function () { RT.demo = false; audioInit(); startGPS(); await startOrient(); startMag(); begin(); };
  $('#btnDemo').onclick = function () { RT.demo = true; S.pins = demoPins(); S.scans = []; S.sel = S.pins[0].id; S.settings.sound = 'guide'; audioInit(); begin(); };
  $$('nav button').forEach(function (b) { b.onclick = function () { setTab(b.dataset.tab); }; });
  $('#btnGear').onclick = openSettings;
  $('#sheet').onclick = function (e) { if (e.target === this) closeSheet(); };
  $$('#segRange button').forEach(function (b) { b.onclick = function () { S.settings.range = +b.dataset.r; save(); syncRange(); }; });
  function syncRange() { $$('#segRange button').forEach(function (b) { b.classList.toggle('on', +b.dataset.r === S.settings.range); }); }
  syncRange();
  $('#btnOrient').onclick = function () { S.settings.northUp = !S.settings.northUp; save(); updateOrientBtn(); };
  $('#btnSound').onclick = function () { var m = ['guide', 'detect', 'off'], i = m.indexOf(S.settings.sound); S.settings.sound = m[(i + 1) % 3]; audioInit(); save(); updateSoundBtn(); };
  $('#btnBase').onclick = function () { if (RT.mag.ok) { RT.filt.base = RT.mag.total; } };
  $('#btnAddPin').onclick = function () { if (!RT.pos) { toast(RT.gpsErr || t('gps_wait')); return; } addPin(RT.pos.lat, RT.pos.lon); renderPins(); renderSelCard(); mapSyncMarkers(); };
  $('#btnImport').onclick = function () { $('#fileKml').click(); };
  $('#fileKml').onchange = function () { if (this.files[0]) importKml(this.files[0]); this.value = ''; };
  $('#btnOpenPrj').onclick = function () { $('#filePrj').click(); };
  $('#filePrj').onchange = function () { if (this.files[0]) importProject(this.files[0]); this.value = ''; };
  $('#btnPatrol').onclick = function () { RT.patrol = !RT.patrol; updatePatrolBtn(); };
  $('#pinList').onclick = function (e) { var r = e.target.closest('.row'); if (r) selectPin(r.dataset.id); };
  $('#radar').onclick = function (e) {
    var rc = this.getBoundingClientRect(), px = e.clientX - rc.left, py = e.clientY - rc.top, best = null, bd = 28;
    RAD.hits.forEach(function (h) { var d = Math.hypot(h.x - px, h.y - py); if (d < bd) { bd = d; best = h; } });
    if (best) selectPin(best.id);
  };
  ['scMode', 'scW', 'scL', 'scSp', 'scSt'].forEach(function (id) { $('#' + id).onchange = readScanForm; });
  $('#btnBuild').onclick = buildScan;
  $('#exSel').onchange = function () { RT.exSel = this.value; renderExport(); };
  $('#mbTilt').onclick = function () { if (MAP.map) MAP.map.easeTo({ pitch: MAP.map.getPitch() > 10 ? 0 : 60, duration: 500 }); };
  $('#mbLabels').onclick = function () {

  };

      MAP.map.setLayoutProperty('osm', 'visibility', MAP.street ? 'visible' : 'none');
      var v = !MAP.street && MAP.labels ? 'visible' : 'none';
      MAP.map.setLayoutProperty('lab', 'visibility', v); MAP.map.setLayoutProperty('road', 'visibility', v);
    }
  };
  $('#mbMe').onclick = function () { if (MAP.map && RT.pos) MAP.map.flyTo({ center: [RT.pos.lon, RT.pos.lat], zoom: 19.5 }); };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { });
}
window.UI = { renderPins: renderPins, endLine: endLine };
window.__RZ = { S: S, RT: RT, C: C, I: I };
init();
})();
