name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        run: |
            set -e
            mkdir -p _apk
            cd _apk
            mkdir -p "$(dirname 'app/build.gradle')"
            cat > 'app/build.gradle' <<'ZKEOF'
            plugins {
                id 'com.android.application'
            }

            android {
                namespace 'com.zaminkav.radar'
                compileSdk 34

                defaultConfig {
                    applicationId 'com.zaminkav.radar'
                    minSdk 24
                    targetSdk 34
                    versionCode 1
                    versionName '1.0'
                }

                buildTypes {
                    release {
                        minifyEnabled false
                    }
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            dependencies {
                implementation 'androidx.webkit:webkit:1.11.0'
            }
            ZKEOF
            mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
            cat > 'app/src/main/AndroidManifest.xml' <<'ZKEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                <uses-permission android:name="android.permission.INTERNET" />
                <uses-permission android:name="android.permission.CAMERA" />
                <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                <uses-permission android:name="android.permission.VIBRATE" />
                <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

                <uses-feature android:name="android.hardware.camera" android:required="false" />
                <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />

                <application
                    android:allowBackup="true"
                    android:icon="@drawable/ic_launcher"
                    android:label="@string/app_name"
                    android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true"
                        android:screenOrientation="portrait"
                        android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            ZKEOF
            mkdir -p "$(dirname 'app/src/main/java/com/zaminkav/radar/MainActivity.java')"
            cat > 'app/src/main/java/com/zaminkav/radar/MainActivity.java' <<'ZKEOF'
            package com.zaminkav.radar;

            import android.Manifest;
            import android.app.Activity;
            import android.content.pm.PackageManager;
            import android.hardware.Sensor;
            import android.hardware.SensorEvent;
            import android.hardware.SensorEventListener;
            import android.hardware.SensorManager;
            import android.os.Bundle;
            import android.view.WindowManager;
            import android.webkit.GeolocationPermissions;
            import android.webkit.JavascriptInterface;
            import android.webkit.PermissionRequest;
            import android.webkit.WebChromeClient;
            import android.webkit.WebResourceRequest;
            import android.webkit.WebResourceResponse;
            import android.webkit.WebSettings;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;

            import androidx.webkit.WebViewAssetLoader;

            public class MainActivity extends Activity implements SensorEventListener {

                private static final int REQ_ALL = 10;
                private static final String START_URL = "https://appassets.androidplatform.net/assets/index.html";

                private WebView web;
                private SensorManager sensorManager;
                private Sensor magSensor;
                private boolean magWanted = false;
                private boolean magRegistered = false;
                private long lastPush = 0;

                private PermissionRequest pendingWebPermission;
                private GeolocationPermissions.Callback pendingGeoCallback;
                private String pendingGeoOrigin;

                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                    sensorManager = (SensorManager) getSystemService(SENSOR_SERVICE);
                    magSensor = sensorManager == null ? null : sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);

                    web = new WebView(this);
                    setContentView(web);

                    WebSettings s = web.getSettings();
                    s.setJavaScriptEnabled(true);
                    s.setDomStorageEnabled(true);
                    s.setGeolocationEnabled(true);
                    s.setMediaPlaybackRequiresUserGesture(false);
                    s.setAllowFileAccess(false);
                    s.setAllowContentAccess(false);

                    final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                            .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                            .build();

                    web.setWebViewClient(new WebViewClient() {
                        @Override
                        public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                            return loader.shouldInterceptRequest(request.getUrl());
                        }
                    });

                    web.setWebChromeClient(new WebChromeClient() {
                        @Override
                        public void onPermissionRequest(final PermissionRequest request) {
                            runOnUiThread(new Runnable() {
                                @Override
                                public void run() {
                                    if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                        request.grant(request.getResources());
                                    } else {
                                        pendingWebPermission = request;
                                        requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_ALL);
                                    }
                                }
                            });
                        }

                        @Override
                        public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                            if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                                callback.invoke(origin, true, false);
                            } else {
                                pendingGeoOrigin = origin;
                                pendingGeoCallback = callback;
                                requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,
                                        Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_ALL);
                            }
                        }
                    });

                    web.addJavascriptInterface(new Bridge(), "AndroidMag");

                    if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED
                            || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        requestPermissions(new String[]{Manifest.permission.CAMERA,
                                Manifest.permission.ACCESS_FINE_LOCATION,
                                Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_ALL);
                    }

                    web.loadUrl(START_URL);
                }

                @Override
                public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                    super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                    if (requestCode != REQ_ALL) return;
                    if (pendingWebPermission != null) {
                        if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                            pendingWebPermission.grant(pendingWebPermission.getResources());
                        } else {
                            pendingWebPermission.deny();
                        }
                        pendingWebPermission = null;
                    }
                    if (pendingGeoCallback != null) {
                        boolean ok = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                                || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                        pendingGeoCallback.invoke(pendingGeoOrigin, ok, false);
                        pendingGeoCallback = null;
                        pendingGeoOrigin = null;
                    }
                }

                private void registerMag() {
                    if (magSensor == null || sensorManager == null || magRegistered) return;
                    sensorManager.registerListener(this, magSensor, SensorManager.SENSOR_DELAY_GAME);
                    magRegistered = true;
                }

                private void unregisterMag() {
                    if (sensorManager != null && magRegistered) {
                        sensorManager.unregisterListener(this);
                        magRegistered = false;
                    }
                }

                @Override
                protected void onResume() {
                    super.onResume();
                    if (web != null) web.onResume();
                    if (magWanted) registerMag();
                }

                @Override
                protected void onPause() {
                    unregisterMag();
                    if (web != null) web.onPause();
                    super.onPause();
                }

                @Override
                protected void onDestroy() {
                    unregisterMag();
                    if (web != null) {
                        web.destroy();
                        web = null;
                    }
                    super.onDestroy();
                }

                @Override
                public void onSensorChanged(SensorEvent event) {
                    if (event.sensor.getType() != Sensor.TYPE_MAGNETIC_FIELD || web == null) return;
                    long now = System.currentTimeMillis();
                    if (now - lastPush < 25) return;
                    lastPush = now;
                    final String js = "window.__magPush&&window.__magPush(" + event.values[0] + "," + event.values[1] + "," + event.values[2] + ")";
                    web.evaluateJavascript(js, null);
                }

                @Override
                public void onAccuracyChanged(Sensor sensor, int accuracy) {
                }

                @Override
                public void onBackPressed() {
                    if (web != null && web.canGoBack()) web.goBack();
                    else super.onBackPressed();
                }

                public class Bridge {
                    @JavascriptInterface
                    public boolean has() {
                        return magSensor != null;
                    }

                    @JavascriptInterface
                    public void start() {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                magWanted = true;
                                registerMag();
                            }
                        });
                    }

                    @JavascriptInterface
                    public void stop() {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                magWanted = false;
                                unregisterMag();
                            }
                        });
                    }
                }
            }
            ZKEOF
            mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher.xml')"
            cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'ZKEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp"
                android:height="108dp"
                android:viewportWidth="108"
                android:viewportHeight="108">
                <path android:fillColor="#071318" android:pathData="M0,0h108v108h-108z" />
                <path
                    android:strokeColor="#3DF5C0"
                    android:strokeWidth="3"
                    android:fillColor="#00000000"
                    android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0" />
                <path
                    android:strokeColor="#2A8F74"
                    android:strokeWidth="2"
                    android:fillColor="#00000000"
                    android:pathData="M54,54m-20,0a20,20 0,1 1,40 0a20,20 0,1 1,-40 0" />
                <path
                    android:strokeColor="#3DF5C0"
                    android:strokeWidth="3"
                    android:pathData="M54,54L54,20" />
                <path android:fillColor="#FF5D62" android:pathData="M70,38m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0" />
            </vector>
            ZKEOF
            mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
            cat > 'app/src/main/res/values/strings.xml' <<'ZKEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <string name="app_name">رادار زمین‌کاو</string>
            </resources>
            ZKEOF
            mkdir -p "$(dirname 'build.gradle')"
            cat > 'build.gradle' <<'ZKEOF'
            plugins {
                id 'com.android.application' version '8.5.2' apply false
            }
            ZKEOF
            mkdir -p "$(dirname 'gradle.properties')"
            cat > 'gradle.properties' <<'ZKEOF'
            android.useAndroidX=true
            org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
            ZKEOF
            mkdir -p "$(dirname 'settings.gradle')"
            cat > 'settings.gradle' <<'ZKEOF'
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "RadarApp"
            include ':app'
            ZKEOF
            mkdir -p app/src/main/assets
            cp ../index.html app/src/main/assets/index.html

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: _apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp _apk/app/build/outputs/apk/debug/app-debug.apk Radar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Radar-apk
          path: Radar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Radar APK ${{ github.run_number }}
          files: Radar.apk
